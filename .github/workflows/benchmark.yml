name: Benchmark CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            libbenchmark-dev
          pip3 install pytest

      - name: Build project
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run benchmarks
        run: |
          mkdir -p results
          ./build/benchmarks/bench_sort \
            --benchmark_format=json \
            --benchmark_out=results/benchmark_results.json

      - name: Run pytest
        run: |
          pytest tests/test_benchmarks.py -v

      - name: Download previous baseline
        uses: dawidd6/action-download-artifact@v6
        with:
          name: benchmark-baseline
          path: results/
          if_no_artifact_found: warn
        continue-on-error: true
        # continue-on-error means: if no baseline exists yet
        # (first run), don't fail — just keep going

      - name: Check for regressions
        run: |
          if [ ! -f results/baseline.json ]; then
            echo "No baseline found — this is the first run"
            echo "Saving current results as baseline"
            cp results/benchmark_results.json results/baseline.json
          else
            python3 tests/regression_detector.py
          fi

      - name: Save current results as new baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: results/benchmark_results.json
          overwrite: true
        # Every successful run updates the baseline
        # So baseline always reflects the last known good state

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: results/benchmark_results.json
        # Also save results tagged by commit hash
        # So you have a full history of every run

      - name: Print benchmark summary
        run: |
          echo "════════════════════════════════════"
          echo "       BENCHMARK RESULTS SUMMARY    "
          echo "════════════════════════════════════"
          python3 - << 'PYEOF'
          import json
          with open("results/benchmark_results.json") as f:
              data = json.load(f)
          for b in data["benchmarks"]:
              name = b["name"].ljust(35)
              time = f"{b['real_time']:.0f} ns"
              ips  = f"{b.get('items_per_second', 0)/1e6:.1f}M items/sec"
              print(f"  {name} {time.rjust(12)}  {ips.rjust(20)}")
          PYEOF